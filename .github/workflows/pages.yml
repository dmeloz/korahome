name: Pages

# Publie l'app sur GitHub Pages (https://dmeloz.github.io/korahome/) à chaque arrivée dans main,
# depuis le 20 octobre 2026 (Netlify a épuisé ses crédits gratuits, voir docs/en-ligne.md).
# Gratuit et sans compteur ; demande un dépôt public sur l'offre gratuite de GitHub.
# L'adresse et la clé « publishable » de Supabase : des variables du dépôt si elles existent
# (Settings › Secrets and variables › Actions › Variables), sinon celles écrites ici. Cette clé est
# faite pour être publique : elle part dans chaque navigateur, et les règles de sécurité de la base
# (RLS) décident de ce qu'elle peut lire. La clé « secret / service_role », elle, ne va nulle part.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      KORAHOME_BASE: /korahome/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ffnmyfrzqvhvafnxvyxx.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_3g_4raK7TI1DZz8CoIyKnA_Z7GZZQe_' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
